name: PeecerVoiceTCP
version: 1.0.1
main: peecer.voice.tcp.PaperBootstrap
api-version: '1.21'
depend: [voicechat]
author: peecer
description: TCP voice transport for Simple Voice Chat on Paper and Leaf
commands:
